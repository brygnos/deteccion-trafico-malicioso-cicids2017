[pytest]
# Ejecutar desde la raíz del proyecto:  python -m pytest
testpaths = tests
pythonpath = .
addopts = -rs --strict-markers
markers =
    manual: verificación que requiere una persona o el tablero desplegado (se documenta, no se automatiza)
    datos_locales: requiere data/processed o data/interim (no viajan con el repositorio)
